services:
  db:
    image: ankane/pgvector:latest
    container_name: piubella-db
    ports:
      - "5499:5432"
    environment:
      POSTGRES_USER: piubella
      POSTGRES_PASSWORD: piubella
      POSTGRES_DB: piubella
    volumes:
      # Se ejecutan en orden alfabético SOLO en el primer arranque (volumen vacío)
      - ./src/db/migrations/1.0.0/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./src/db/migrations/1.1.0/sync.sql:/docker-entrypoint-initdb.d/02-sync.sql:ro
      - ./src/db/migrations/1.2.0/reconcile.sql:/docker-entrypoint-initdb.d/03-reconcile.sql:ro
      - ./src/db/migrations/1.3.0/reservations.sql:/docker-entrypoint-initdb.d/04-reservations.sql:ro
      - ./src/db/migrations/1.4.0/trainings-web.sql:/docker-entrypoint-initdb.d/05-trainings-web.sql:ro
      - ./src/db/migrations/1.5.0/mercadopago.sql:/docker-entrypoint-initdb.d/06-mercadopago.sql:ro
      - ./src/db/migrations/1.6.0/promotions.sql:/docker-entrypoint-initdb.d/07-promotions.sql:ro
      - ./src/db/migrations/1.7.0/payment-appointment.sql:/docker-entrypoint-initdb.d/08-payment-appointment.sql:ro
      - ./src/db/migrations/1.8.0/crm-pipeline.sql:/docker-entrypoint-initdb.d/09-crm-pipeline.sql:ro
      - ./src/db/migrations/1.9.0/arca-issuers.sql:/docker-entrypoint-initdb.d/10-arca-issuers.sql:ro
      - ./src/db/migrations/1.9.0/channels-config.sql:/docker-entrypoint-initdb.d/10b-channels-config.sql:ro
      - ./src/db/migrations/1.10.0/inbox.sql:/docker-entrypoint-initdb.d/11-inbox.sql:ro
      - ./src/db/migrations/1.11.0/automation.sql:/docker-entrypoint-initdb.d/12-automation.sql:ro
      - ./src/db/migrations/1.12.0/automation-faq.sql:/docker-entrypoint-initdb.d/13-automation-faq.sql:ro
      - ./src/db/migrations/1.13.0/messages-external-id.sql:/docker-entrypoint-initdb.d/14-messages-external-id.sql:ro
      - ./src/db/migrations/1.14.0/messages-conversation-index.sql:/docker-entrypoint-initdb.d/15-messages-conversation-index.sql:ro
      - ./src/db/migrations/1.15.0/line-item-description.sql:/docker-entrypoint-initdb.d/16-line-item-description.sql:ro
      - ./src/db/migrations/1.16.0/payment-items.sql:/docker-entrypoint-initdb.d/17-payment-items.sql:ro
      - ./src/db/migrations/1.17.0/service-embeddings.sql:/docker-entrypoint-initdb.d/18-service-embeddings.sql:ro
      - ./src/db/migrations/1.18.0/ai-provider-credentials.sql:/docker-entrypoint-initdb.d/19-ai-provider-credentials.sql:ro
      - ./src/db/migrations/1.19.0/service-treatment-fields.sql:/docker-entrypoint-initdb.d/20-service-treatment-fields.sql:ro
      - ./src/db/migrations/1.20.0/training-subscriptions.sql:/docker-entrypoint-initdb.d/21-training-subscriptions.sql:ro
      - ./src/db/migrations/1.21.0/activities.sql:/docker-entrypoint-initdb.d/22-activities.sql:ro
      - ./src/db/migrations/1.21.0/whatsapp-reliability.sql:/docker-entrypoint-initdb.d/23-whatsapp-reliability.sql:ro
      - ./src/db/migrations/1.21.1/add-activity-id-to-appointments.sql:/docker-entrypoint-initdb.d/24-add-activity-id-to-appointments.sql:ro
      - ./src/db/migrations/1.21.2/fix-training-subscriptions-activity-id.sql:/docker-entrypoint-initdb.d/25-fix-training-subscriptions-activity-id.sql:ro
      - ./src/db/migrations/1.22.0/add-training-subscription-to-billing-cycles.sql:/docker-entrypoint-initdb.d/26-add-training-subscription-to-billing-cycles.sql:ro
      - ./src/db/migrations/1.22.1/fix-billing-cycles-nullable-and-unique.sql:/docker-entrypoint-initdb.d/27-fix-billing-cycles-nullable-and-unique.sql:ro
      - ./src/db/migrations/1.22.2/drop-dangling-training-fk.sql:/docker-entrypoint-initdb.d/28-drop-dangling-training-fk.sql:ro
      - ./src/db/migrations/1.23.0/activity-attendance-unique.sql:/docker-entrypoint-initdb.d/29-activity-attendance-unique.sql:ro
      - ./src/db/migrations/1.24.0/classes-agenda.sql:/docker-entrypoint-initdb.d/30-classes-agenda.sql:ro
      - ./src/db/migrations/1.24.1/reconcile-billing-cycles-nullability.sql:/docker-entrypoint-initdb.d/31-reconcile-billing-cycles-nullability.sql:ro
      - ./src/db/migrations/1.25.0/credit-movements.sql:/docker-entrypoint-initdb.d/32-credit-movements.sql:ro
      - ./src/db/migrations/1.26.0/00-safety.sql:/docker-entrypoint-initdb.d/33-safety.sql:ro
      - ./src/db/migrations/1.26.0/06-activity-embeddings.sql:/docker-entrypoint-initdb.d/34-activity-embeddings.sql:ro
      - ./src/db/migrations/1.27.0/01-training-embeddings.sql:/docker-entrypoint-initdb.d/35-training-embeddings.sql:ro
      - ./src/db/migrations/1.30.0/01-combos.sql:/docker-entrypoint-initdb.d/36-combos.sql:ro
      - ./src/db/migrations/1.31.0/01-reparar-precios-combo.sql:/docker-entrypoint-initdb.d/37-reparar-precios-combo.sql:ro
      - ./src/db/migrations/1.32.0/01-limpiar-markdown-servicios.sql:/docker-entrypoint-initdb.d/38-limpiar-markdown-servicios.sql:ro
      - ./src/db/migrations/1.33.0/01-reparar-fechas-nacimiento.sql:/docker-entrypoint-initdb.d/39-reparar-fechas-nacimiento.sql:ro
      - ./src/db/migrations/1.35.0/01-depilacion-zonas.sql:/docker-entrypoint-initdb.d/39b-depilacion-zonas.sql:ro
      - ./src/db/migrations/1.36.0/01-pack-por-combo.sql:/docker-entrypoint-initdb.d/39c-pack-por-combo.sql:ro
      - ./src/db/migrations/1.37.0/01-ejes-catalogo.sql:/docker-entrypoint-initdb.d/39d-ejes-catalogo.sql:ro
      - ./src/db/migrations/1.39.0/01-reconciliar-esquema.sql:/docker-entrypoint-initdb.d/39e-reconciliar-esquema.sql:ro
      - ./src/db/migrations/1.40.0/01-historial-reagendamientos.sql:/docker-entrypoint-initdb.d/39f-historial-reagendamientos.sql:ro
      - ./src/db/migrations/1.41.0/01-insumos.sql:/docker-entrypoint-initdb.d/39g-insumos.sql:ro
      - ./src/db/migrations/1.43.0/01-recetas.sql:/docker-entrypoint-initdb.d/39h-recetas.sql:ro
      - ./src/db/migrations/1.44.0/01-consumo-de-insumos.sql:/docker-entrypoint-initdb.d/39i-consumo-de-insumos.sql:ro
      - ./src/db/migrations/1.45.0/01-venta-de-packs.sql:/docker-entrypoint-initdb.d/39j-venta-de-packs.sql:ro
      #
      # Acá arriba van SÓLO las migraciones de ESQUEMA. Las de DATOS no se
      # montan y no es un olvido: traen UUIDs de producción hardcodeados y
      # contra una base recién creada fallan con
      #   ERROR: insert or update on table "categories" violates foreign key
      #          constraint "fk_cat_parent"
      # y ahí el entrypoint de Postgres aborta, dejando la base a medio armar
      # (sin `combos`, entre otras).
      #
      # Las que quedan afuera por eso: 1.26.0/01-dedupe, 02-restructure,
      # 03-eje-corporal, 04-eje-dermatologia, 05-limpieza-eje,
      # 07-archivar-eje-viejo, 08-cosmetologia-facial, 1.28.0, 1.29.0,
      # 1.34.0, 1.37.0/02 y /03, y 1.38.0/01.
      #
      # El catálogo real NO sale de correr esas migraciones: se copia de
      # producción a la base local con `scripts/traer-catalogo.sh`, que trae el
      # resultado ya cocinado. Por eso alcanza con que el ESQUEMA esté al día.
      #
      # 1.4.0/rag-infrastructure.sql tampoco se monta: sus columnas y tablas ya
      # las crean 1.17.0, 1.18.0 y 1.19.0, que sí están acá.
      # 1.38.0/00-backup.sql es una red para producción, en local no hace falta.
      #
      # Cada migración de ESQUEMA nueva se agrega acá arriba; el seed va último
      # porque Postgres corre /docker-entrypoint-initdb.d en orden alfabético.
      - ./src/db/seed.dev.sql:/docker-entrypoint-initdb.d/40-seed.sql:ro
      - ./src/db/migrations/1.51.0/01-servicio-comprado.sql:/docker-entrypoint-initdb.d/39k-servicio-comprado.sql:ro
      # 39m: después de la 1.51.0 que crea la tabla, y antes del seed (40-).
      - ./src/db/migrations/1.52.0/01-precio-del-servicio-comprado.sql:/docker-entrypoint-initdb.d/39m-precio-del-servicio-comprado.sql:ro
      - ./src/db/migrations/1.53.0/01-promos-con-combos-y-packs.sql:/docker-entrypoint-initdb.d/39n-promos-con-combos-y-packs.sql:ro
      - piubella-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piubella -d piubella"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  piubella-pgdata:
