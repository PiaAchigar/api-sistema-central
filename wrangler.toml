name = "piubella-worker"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive hacia Supabase Postgres
# El ID se completo desde `wrangler hyperdrive create`.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "7e802994d43e47b0b038a50423291f8f"

# En dev apunta al Postgres local de docker-compose (npm run db:up).
# Para desarrollar contra Supabase real, NO editar esto: exportar la variable
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE con la connection
# string directa de Supabase (pisa este valor y no queda commiteada).
localConnectionString = "postgresql://piubella:piubella@localhost:5499/piubella"

# Variables de entorno no secretas
[vars]
ARCA_MODE = "mock"          # "mock" | "afip"
ARCA_ENV = "homo"           # "homo" (homologación) | "prod" — solo aplica si ARCA_MODE="afip"
ARCA_POS = "2"              # punto de venta (0002)
ARCA_INVOICE_TYPE = "C"     # monotributo emite Factura C
# URL del proyecto Supabase. Se usa para verificar los access tokens (ES256)
# contra el JWKS público. No es secreto. Setear el mismo valor en producción.
SUPABASE_URL = "https://pfemndbftxhlcvyhpbfg.supabase.co"

# Cron triggers. Cloudflare invoca `scheduled()` en src/index.ts una vez por
# cada patrón — index.ts ramifica por `event.cron` para saber cuál corrió.
#
# "* * * * *" → procesa message_queue (Task 2 — confiabilidad WhatsApp, ver
# src/workers/queue-processor.ts). El plan original pedía "cada 10 segundos",
# pero Cloudflare Cron Triggers no soportan granularidad de segundos — el
# mínimo es 1 minuto. Con MAX_MESSAGES_PER_RUN=10 en queue-processor.ts, una
# corrida por minuto da máx 10 msgs/min, que es exactamente el rate limit de
# automatizaciones pedido (no hace falta el "cada 10s" para cumplirlo).
[triggers]
crons = ["* * * * *"]

# Para agregar el cron de recalcular embeddings pendientes
# (service_embeddings.embedding IS NULL — ver src/workers/embedding-calculator.ts),
# sumar su patrón al array de arriba, ej: crons = ["* * * * *", "*/5 * * * *"].
# Deshabilitado por default: cada corrida gasta la credencial de Anthropic
# activa en ai_provider_credentials, y tal como está implementado hoy el
# "embedding" generado NO es un embedding semántico real (Claude no tiene
# endpoint de embeddings, ver advertencia en src/lib/embedding.ts) —
# habilitarlo antes de resolver ese punto solo gasta plata sin acercar la
# búsqueda semántica a funcionar. Sumar cuando se migre a un proveedor con
# embeddings reales (Voyage AI u OpenAI).

# Secretos — NO van en este archivo. Configurar con:
#   wrangler secret put API_KEY               ← API key estática (para backend-to-backend / dev)
#   wrangler secret put AFIP_CUIT             ← solo si ARCA_MODE="afip"
#   wrangler secret put AFIP_SDK_TOKEN        ← token de app.afipsdk.com
#   wrangler secret put AFIP_CERT             ← certificado .crt (pegar PEM o base64)
#   wrangler secret put AFIP_KEY              ← clave privada .key (pegar PEM o base64)
# Para dev local, crear .dev.vars (no commitear) con:
#   SUPABASE_URL=https://pfemndbftxhlcvyhpbfg.supabase.co
#   API_KEY=fcac8522-f474-4d29-bd4f-92913a816541
#   AFIP_CERT y AFIP_KEY en .dev.vars: usar base64 en una sola línea
#   (el PEM multilínea no entra en .dev.vars; ver ARCA_SETUP.md).
# Nota: SUPABASE_JWT_SECRET quedó obsoleto (los tokens son ES256, no HMAC).
