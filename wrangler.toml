name = "piubella-worker"
main = "src/index.ts"
compatibility_date = "2026-06-03"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive hacia Supabase Postgres
# El ID se completo desde `wrangler hyperdrive create`.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "7e802994d43e47b0b038a50423291f8f"

# En dev apunta al Postgres local de docker-compose (npm run db:up).
# Para desarrollar contra Supabase real, NO editar esto: exportar la variable
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE con la connection
# string directa de Supabase (pisa este valor y no queda commiteada).
localConnectionString = "postgresql://piubella:piubella@localhost:5499/piubella"

# Variables de entorno no secretas
[vars]
ARCA_MODE = "mock"          # "mock" | "afip"
ARCA_POS = "2"              # punto de venta (0002)
ARCA_INVOICE_TYPE = "C"     # monotributo emite Factura C
# URL del proyecto Supabase. Se usa para verificar los access tokens (ES256)
# contra el JWKS público. No es secreto. Setear el mismo valor en producción.
SUPABASE_URL = "https://pfemndbftxhlcvyhpbfg.supabase.co"

# Secretos — NO van en este archivo. Configurar con:
#   wrangler secret put API_KEY               ← API key estática (para backend-to-backend / dev)
#   wrangler secret put AFIP_CUIT             ← solo si ARCA_MODE="afip"
#   wrangler secret put AFIP_SDK_TOKEN        ← solo si ARCA_MODE="afip"
# Para dev local, crear .dev.vars (no commitear) con:
#   SUPABASE_URL=https://pfemndbftxhlcvyhpbfg.supabase.co
#   API_KEY=fcac8522-f474-4d29-bd4f-92913a816541
# Nota: SUPABASE_JWT_SECRET quedó obsoleto (los tokens son ES256, no HMAC).
